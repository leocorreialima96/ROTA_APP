name: CI

on:
  push:
  pull_request:

jobs:
  app:
    name: App (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --no-web-resources-cdn

  firebase:
    name: Regras de segurança e funções (simulador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - name: Testes unitários das funções
        run: npm test
        working-directory: functions
      - name: Testes das regras (tentam ler dados de outra conta)
        run: npm run test:rules
      - name: Testes das funções no simulador
        run: npm run test:functions
